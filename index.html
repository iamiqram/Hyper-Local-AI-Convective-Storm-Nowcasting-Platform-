<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Nowcasting Command Center</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background: #111; }
        
        /* CSS Invert for Free Dark Mode Map */
        .leaflet-layer, .leaflet-control-zoom-in, .leaflet-control-zoom-out, .leaflet-control-attribution {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        
        /* Frosted Glass Sidebar */
        .sidebar {
            position: absolute; top: 20px; left: 20px; width: 340px;
            background: rgba(20, 25, 35, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: #fff; padding: 24px; z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .header { margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .header h2 { margin: 0; font-size: 20px; font-weight: 600; color: #4facfe; }
        .header p { margin: 5px 0 0 0; font-size: 12px; color: #aaa; }
        
        /* Alert Box */
        .alert-box {
            background: rgba(255, 59, 48, 0.15); border-left: 4px solid #ff3b30;
            padding: 15px; border-radius: 4px; margin-bottom: 20px;
        }
        .alert-box h3 { margin: 0 0 5px 0; color: #ff3b30; font-size: 16px; }
        .alert-box p { margin: 0; font-size: 14px; color: #ddd; line-height: 1.4; }
        .eta { font-weight: bold; color: #fff; font-size: 16px; margin-top: 8px; display: block; }
        
        /* Controls */
        .controls { display: flex; flex-direction: column; gap: 15px; }
        .slider-container { display: flex; flex-direction: column; gap: 8px; }
        .slider-labels { display: flex; justify-content: space-between; font-size: 11px; color: #888; font-weight: bold; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: #4facfe; cursor: pointer; margin-top: -6px;
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.2); border-radius: 2px;
        }
        
        .play-btn {
            background: #4facfe; color: #000; border: none; padding: 10px; border-radius: 6px;
            font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s;
        }
        .play-btn:hover { background: #00f2fe; }
        
        /* Target Marker Pulse */
        .pulse-marker {
            width: 12px; height: 12px; background: #ff3b30; border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 59, 48, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div class="sidebar">
        <div class="header">
            <h2>Nowcast Engine Engine</h2>
            <p>Convective Scale AI Prediction (0-6 hr)</p>
        </div>
        
        <div class="alert-box">
            <h3>🚨 CRITICAL HAZARD</h3>
            <p>Severe Cloudburst signatures detected moving towards Guwahati Metro.</p>
            <span class="eta">Impact ETA: <span id="eta-time">45</span> mins</span>
        </div>
        
        <div class="controls">
            <div class="slider-container">
                <div class="slider-labels">
                    <span>T-0 (Now)</span>
                    <span>T+60 (Forecast)</span>
                </div>
                <input type="range" id="timeSlider" min="0" max="60" value="0" step="1">
            </div>
            <button class="play-btn" id="playBtn">▶ Play Simulation</button>
        </div>
    </div>

    <script>
        // 1. Initialize Map (Guwahati centered)
        const map = L.map('map', {zoomControl: false}).setView([26.1445, 91.7362], 9);
        L.control.zoom({position: 'topright'}).addTo(map);

        // 2. Standard OpenStreetMap with CSS Invert for a free, watermark-free dark mode
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 3. Target City Marker for Guwahati
        const targetIcon = L.divIcon({ className: 'pulse-marker', iconSize: [12, 12] });
        L.marker([26.1445, 91.7362], {icon: targetIcon}).addTo(map).bindPopup("<b>Guwahati</b><br>Target Impact Zone");

        // 4. Canvas Overlay for Synthetic Radar Generation
        let canvasOverlay = L.imageOverlay('', [[25.5, 90.0], [27.0, 93.0]], {opacity: 0.6});
        canvasOverlay.addTo(map);

        function drawRadar(progress) {
            const canvas = document.createElement('canvas');
            canvas.width = 800; canvas.height = 600;
            const ctx = canvas.getContext('2d');
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Calculate movement (progress is 0 to 60)
            const startX = 150; const startY = 300;
            const endX = 500; const endY = 280; 
            
            const currentX = startX + ((endX - startX) * (progress / 60));
            const currentY = startY + ((endY - startY) * (progress / 60));
            
            // Draw outer storm halo (Green/Yellow)
            const outerGradient = ctx.createRadialGradient(currentX, currentY, 10, currentX, currentY, 120);
            outerGradient.addColorStop(0, "rgba(173, 255, 47, 0.8)");
            outerGradient.addColorStop(0.6, "rgba(255, 215, 0, 0.5)");
            outerGradient.addColorStop(1, "rgba(0, 255, 0, 0)");
            
            ctx.beginPath();
            ctx.arc(currentX, currentY, 120, 0, Math.PI * 2);
            ctx.fillStyle = outerGradient;
            ctx.fill();

            // Draw intense inner core (Red/Cloudburst)
            const innerGradient = ctx.createRadialGradient(currentX, currentY, 0, currentX, currentY, 40);
            innerGradient.addColorStop(0, "rgba(255, 0, 0, 0.95)");
            innerGradient.addColorStop(1, "rgba(255, 0, 0, 0)");
            
            ctx.beginPath();
            ctx.arc(currentX, currentY, 40, 0, Math.PI * 2);
            ctx.fillStyle = innerGradient;
            ctx.fill();

            canvasOverlay.setUrl(canvas.toDataURL());
            
            // Dynamically update the ETA text based on slider position
            const eta = Math.max(0, 45 - Math.floor(progress));
            document.getElementById('eta-time').innerText = eta;
        }

        drawRadar(0);

        // 5. Playback & Slider Logic
        const slider = document.getElementById('timeSlider');
        slider.addEventListener('input', (e) => { drawRadar(e.target.value); });

        let isPlaying = false;
        let playInterval;
        const playBtn = document.getElementById('playBtn');

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                clearInterval(playInterval);
                playBtn.innerText = "▶ Play Simulation";
                isPlaying = false;
            } else {
                playBtn.innerText = "⏸ Pause";
                isPlaying = true;
                if(slider.value >= 60) slider.value = 0;
                
                playInterval = setInterval(() => {
                    let val = parseInt(slider.value);
                    if (val >= 60) {
                        clearInterval(playInterval);
                        playBtn.innerText = "▶ Play Simulation";
                        isPlaying = false;
                    } else {
                        slider.value = val + 1;
                        drawRadar(slider.value);
                    }
                }, 80); // Speed of animation loop
            }
        });
    </script>
</body>
</html>
